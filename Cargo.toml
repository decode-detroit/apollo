[package]
name = "apollo"
version = "2.0.0"
authors = ["Patton Doyle <patton@DecodeDetroit.com>"]
description = "Realtime Remote-Controlled Multimedia Player"
license = "GPL-3.0-or-later"
edition="2024"

[profile.release]
lto = true

[dependencies]
fnv = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
serde_json = "1.0"
gtk4 = "0.11"
gdk4 = "0.11"
gio = "0.22"
gdk-pixbuf = "0.22"
glib = "0.22"
cairo-rs = "0.22"
gstreamer = "0.25"
gstreamer-video = "0.25"
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14", "waylandegl"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4", features = ["server"] }
async-stream = "0.3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
redis = "1.7"

